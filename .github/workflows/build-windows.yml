name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.11-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DTAPEFOUR_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test the tape engine
        run: build/EngineTest_artefacts/Release/EngineTest.exe

      - name: Test the full audio path
        run: build/MixerTest_artefacts/Release/MixerTest.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/TapeFour_artefacts/Release/TapeFour.exe dist/
          Copy-Item README.md, LICENSE dist/
          Copy-Item Resources/fonts/OFL.txt dist/FONTS-OFL.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TapeFour-windows-x64
          path: dist/
          if-no-files-found: error
