name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.11-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DTAPEFOUR_TESTS=ON -DTAPEFOUR_BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test the cassette and deck formats
        run: build/FormatTest_artefacts/Release/FormatTest.exe

      - name: Test the tape engine
        run: build/EngineTest_artefacts/Release/EngineTest.exe

      - name: Test the full audio path
        run: build/MixerTest_artefacts/Release/MixerTest.exe

      - name: Test that a crashing plug-in can't take the scan down
        run: build/ScanTest_artefacts/Release/ScanTest.exe build/crashplugin

      - name: Test the pocket player
        run: build/PlayerTest_artefacts/Release/PlayerTest.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/TapeFour_artefacts/Release/TapeFour.exe dist/
          Copy-Item "build/TapeFourPocket_artefacts/Release/TF-P1 Pocket.exe" dist/
          Copy-Item README.md, LICENSE, Manual/TapeFour-Manual.pdf dist/
          Copy-Item Resources/fonts/OFL.txt dist/FONTS-OFL.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TapeFour-windows-x64
          path: dist/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ladspa-sdk libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.11-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAPEFOUR_TESTS=ON -DTAPEFOUR_WERROR=ON -DTAPEFOUR_BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log || {
            # Compile errors as annotations, so they show on the run's page without the log.
            grep -E ": (fatal )?error:|^ld: |Undefined symbols|undefined reference|error LNK|: error [A-Z]+[0-9]+" build.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1; }

      - name: Test the cassette and deck formats
        run: build/FormatTest_artefacts/Release/FormatTest

      - name: Test the tape engine
        run: xvfb-run -a build/EngineTest_artefacts/Release/EngineTest

      - name: Test the full audio path
        run: xvfb-run -a build/MixerTest_artefacts/Release/MixerTest

      - name: Test that a crashing plug-in can't take the scan down
        run: xvfb-run -a build/ScanTest_artefacts/Release/ScanTest build/crashplugin

      - name: Test the pocket player
        run: xvfb-run -a build/PlayerTest_artefacts/Release/PlayerTest

      - name: Package
        run: |
          mkdir -p dist/TapeFour
          cp build/TapeFour_artefacts/Release/TapeFour dist/TapeFour/
          cp "build/TapeFourPocket_artefacts/Release/TF-P1 Pocket" dist/TapeFour/
          cp README.md LICENSE Manual/TapeFour-Manual.pdf dist/TapeFour/
          cp Resources/fonts/OFL.txt dist/TapeFour/FONTS-OFL.txt
          tar -C dist -czf TapeFour-linux-x64.tar.gz TapeFour

      - uses: actions/upload-artifact@v4
        with:
          name: TapeFour-linux-x64
          path: TapeFour-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.11-${{ runner.os }}

      - name: Configure (Apple silicon and Intel in one app)
        run: >
          cmake -S . -B build -G Xcode -DTAPEFOUR_TESTS=ON -DTAPEFOUR_WERROR=ON -DTAPEFOUR_BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log || {
            # Compile errors as annotations, so they show on the run's page without the log.
            grep -E ": (fatal )?error:|^ld: |Undefined symbols|undefined reference|error LNK|: error [A-Z]+[0-9]+" build.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1; }

      - name: Test the cassette and deck formats
        run: build/FormatTest_artefacts/Release/FormatTest

      - name: Test the tape engine
        run: build/EngineTest_artefacts/Release/EngineTest

      - name: Test the full audio path
        run: build/MixerTest_artefacts/Release/MixerTest

      - name: Test that a crashing plug-in can't take the scan down
        run: build/ScanTest_artefacts/Release/ScanTest build/crashplugin/Release

      - name: Test the pocket player
        run: build/PlayerTest_artefacts/Release/PlayerTest

      - name: Package
        run: |
          mkdir -p dist/TapeFour
          cp -R build/TapeFour_artefacts/Release/TapeFour.app dist/TapeFour/
          # Not notarised: signed ad hoc so it runs; the first launch needs right-click > Open.
          codesign --force --deep --sign - dist/TapeFour/TapeFour.app
          cp -R "build/TapeFourPocket_artefacts/Release/TF-P1 Pocket.app" dist/TapeFour/
          codesign --force --deep --sign - "dist/TapeFour/TF-P1 Pocket.app"
          cp README.md LICENSE Manual/TapeFour-Manual.pdf dist/TapeFour/
          cp Resources/fonts/OFL.txt dist/TapeFour/FONTS-OFL.txt
          ditto -c -k --keepParent dist/TapeFour TapeFour-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TapeFour-macos-universal
          path: TapeFour-macos-universal.zip
          if-no-files-found: error

  # Memory errors, undefined behaviour and data races, caught in the engine and its threads.
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build-ios/_deps
          key: juce-8.0.11-ios

      - name: Configure (the pocket player only, for iPhone and iPad)
        run: >
          cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DTAPEFOUR_WERROR=ON -DTAPEFOUR_BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Build for the simulator
        run: |
          set -o pipefail
          cmake --build build-ios --config Release --target TapeFourPocket -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
            grep -E ": (fatal )?error:|^ld: |Undefined symbols|undefined reference|error LNK|: error [A-Z]+[0-9]+" build.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1; }

      - name: Package
        run: |
          app=$(find build-ios -name "TF-P1 Pocket.app" -path "*iphonesimulator*" | head -1)
          ditto -c -k --keepParent "$app" TF-P1-Pocket-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TF-P1-Pocket-ios-simulator
          path: TF-P1-Pocket-ios-simulator.zip
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address, thread ]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang ladspa-sdk libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.11-${{ runner.os }}-san

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTAPEFOUR_TESTS=ON -DTAPEFOUR_WERROR=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DTAPEFOUR_SANITIZE=${{ matrix.sanitizer }}

      - name: Build the tests
        run: |
          set -o pipefail
          cmake --build build --parallel --target FormatTest EngineTest MixerTest PlayerTest 2>&1 | tee build.log || {
            # Compile errors as annotations, so they show on the run's page without the log.
            grep -E ": (fatal )?error:|^ld: |Undefined symbols|undefined reference|error LNK|: error [A-Z]+[0-9]+" build.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1; }

      - name: Run them
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/Tests/ubsan.supp
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/Tests/tsan.supp
        run: |
          build/FormatTest_artefacts/RelWithDebInfo/FormatTest
          xvfb-run -a build/EngineTest_artefacts/RelWithDebInfo/EngineTest
          xvfb-run -a build/MixerTest_artefacts/RelWithDebInfo/MixerTest
          xvfb-run -a build/PlayerTest_artefacts/RelWithDebInfo/PlayerTest
